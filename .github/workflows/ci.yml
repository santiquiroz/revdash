name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Hacer ejecutable Gradle Wrapper
        run: chmod +x android/gradlew
      - name: Ejecutar pruebas y compilar APK
        run: cd android && ./gradlew :nucleo:test :app:testDebugUnitTest :espejo:testDebugUnitTest :app:assembleDebug :espejo:assembleDebug
      - name: Subir APK de RevDash
        uses: actions/upload-artifact@v4
        with:
          name: revdash-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Subir APK de Espejo
        uses: actions/upload-artifact@v4
        with:
          name: espejo-debug
          path: android/espejo/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar PlatformIO
        run: pip install platformio
      - name: Probar firmware nativo y compilar ESP32
        working-directory: firmware/probe
        run: pio test -e native && pio run -e esp32dev

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias de pruebas
        run: pip install pytest numpy opencv-python-headless
      - name: Probar herramientas
        run: python -m pytest tools/tests
      - name: Probar visión
        run: python -m pytest vision/tests
