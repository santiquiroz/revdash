<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="estados.css"></head><body>
<div class="scr" style="display:grid;grid-template-columns:1.35fr 1fr;gap:24px;padding:28px">
  <div style="display:flex;flex-direction:column;justify-content:space-between">
    <div style="display:flex;gap:14px;align-items:center">
      <span class="arrow on">◀</span><span class="arrow dim">▶</span>
      <span style="width:12px"></span>
      <span class="lamp g">N</span><span class="lamp b">≡D</span><span class="lamp a">⚙</span><span class="lamp off">ABS</span>
    </div>
    <div style="display:flex;align-items:flex-end;gap:14px"><span class="big" style="font-size:230px">42</span><span class="mut" style="font-size:24px;margin-bottom:28px">km/h</span></div>
    <div><div class="rpm"><i></i></div><div class="ticks"><span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span><span>12 ×1000 rpm</span></div></div>
  </div>
  <div style="display:grid;grid-template-rows:1fr 1fr 1fr;gap:16px">
    <div class="tile"><div class="mut">MARCHA · MODO</div><div style="font-weight:800;font-size:44px;margin-top:6px"><span class="on">N</span> · <span style="color:var(--amber)">URBAN</span></div></div>
    <div class="tile"><div class="mut">COMBUSTIBLE</div><div style="font-size:30px;margin-top:8px;letter-spacing:4px">▮▮▮▯▯ <span style="font-size:22px;letter-spacing:0;color:var(--mut)">~95 km</span></div></div>
    <div class="tile"><div class="mut">VIAJE · HORA</div><div style="font-size:30px;margin-top:8px">82.4 km · 12:14</div></div>
  </div>
</div>
</body></html>
